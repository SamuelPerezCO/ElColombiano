<script>
	// Dev-only: keep animations running when the embedded/hidden browser pane
	// suppresses requestAnimationFrame (falls back to a 30fps timer).
	(function () {
		var nativeRaf = window.requestAnimationFrame.bind(window);
		var nativeCancel = window.cancelAnimationFrame.bind(window);
		window.requestAnimationFrame = function (cb) {
			var done = false;
			var timer = setTimeout(function () {
				if (!done) {
					done = true;
					cb(performance.now());
				}
			}, 33);
			var rafId = nativeRaf(function (t) {
				if (!done) {
					done = true;
					clearTimeout(timer);
					cb(t);
				}
			});
			return rafId;
		};
		window.cancelAnimationFrame = nativeCancel;
	})();
</script>
